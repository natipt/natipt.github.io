<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose Garden Palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FBF7F0;--ink:#222A12;--muted:#6b6657}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;padding:32px}
  .head{max-width:1060px;margin:0 auto 1.4rem;text-align:center}
  .head h1{font-family:'Sorts Mill Goudy',Georgia,serif;font-weight:400;font-size:clamp(1.9rem,4vw,2.8rem)}
  .head p{color:var(--muted);font-size:.95rem;margin-top:.3rem}

  .bento{margin:0 auto;display:flex;gap:16px;justify-content:center;align-items:flex-start;max-width:780px}
  .bento.dim .marker:not(.active){opacity:.3;transform:translate(-50%,-50%) scale(.82)}
  .bento.dim .sw:not(.active){opacity:.42}

  .photo{flex:0 0 auto;width:min(52vw,430px);aspect-ratio:3/4;position:relative;border-radius:18px;overflow:hidden;
    box-shadow:0 16px 42px rgba(34,42,18,.16)}
  .photo img{display:block;width:100%;height:100%;object-fit:cover}
  .marker{position:absolute;width:30px;height:30px;border-radius:50%;border:3px solid #fff;transform:translate(-50%,-50%);
    box-shadow:0 2px 9px rgba(0,0,0,.5);cursor:pointer;transition:transform .22s,opacity .22s;display:grid;place-items:center;
    font-size:.72rem;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .marker:hover,.marker.active{transform:translate(-50%,-50%) scale(1.5);z-index:5}
  .marker .tip{position:absolute;bottom:128%;left:50%;transform:translateX(-50%);background:rgba(34,42,18,.94);color:#fff;
    font-size:.68rem;font-weight:600;padding:.3rem .5rem;border-radius:7px;white-space:nowrap;opacity:0;transition:opacity .2s;
    pointer-events:none;text-shadow:none}
  .marker:hover .tip,.marker.active .tip{opacity:1}

  .grid{flex:0 0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:16px;width:min(38vw,279px)}
  .sw{position:relative;border-radius:16px;aspect-ratio:1;cursor:pointer;overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);transition:opacity .2s,transform .2s;
    display:flex;flex-direction:column;justify-content:flex-end;padding:13px}
  .sw:hover,.sw.active{transform:translateY(-3px)}
  .sw .no{position:absolute;top:10px;left:12px;font-size:.74rem;font-weight:700;opacity:.62}
  .sw .nm{font-family:'Montserrat';font-weight:700;font-size:.9rem;line-height:1.15}
  .sw .hx{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.76rem;font-weight:600;opacity:.92;margin-top:.12rem}
  .sw .rl{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-top:.45rem}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#222A12;color:#F3E7D2;
    padding:.6rem 1.1rem;border-radius:999px;font-size:.85rem;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:560px){
    .bento{flex-direction:column;align-items:center}
    .photo{width:min(86vw,360px)}
    .grid{width:min(86vw,360px)}
  }
</style></head>
<body>
  <div class="head">
    <h1>June Hymn</h1>
    <p>Here's a hymn to welcome in the day. <br>
      Heralding a summer's early sway. <br> 
      And all the bulbs all comin' in to begin<br> 
      The thrushes' bleeding battle with the wrens<br> 
    Disrupts my reverie again.</p>
  </div>

  <div class="bento" id="bento">
    <figure class="photo" id="photo"><img id="rose" alt="Apricot rose, the source of the palette"></figure>
    <div class="grid" id="grid"></div>
  </div>
  <div class="toast" id="toast"></div>

    photo.appendChild(m);

    s.className='sw';s.dataset.i=i;s.style.background=c.brand;s.style.color=txt(c.brand);
    s.innerHTML='<span class="no">'+(i+1)+'</span><span class="nm">'+c.name+'</span>'+
                '<span class="hx">'+c.brand+'</span><span class="rl">'+c.role+'</span>';
    grid.appendChild(s);
  });

  const markers=[...document.querySelectorAll('.marker')],sws=[...document.querySelectorAll('.sw')];
  const set=(i,on)=>{bento.classList.toggle('dim',on);
    markers.forEach(m=>m.classList.toggle('active',on&&+m.dataset.i===i));
    sws.forEach(s=>s.classList.toggle('active',on&&+s.dataset.i===i));};
  const bind=el=>{const i=+el.dataset.i;
    el.addEventListener('mouseenter',()=>set(i,true));el.addEventListener('mouseleave',()=>set(i,false));};
  markers.forEach(bind);sws.forEach(bind);

  const toast=document.getElementById('toast');let tt;
  const copy=h=>{navigator.clipboard&&navigator.clipboard.writeText(h);
    toast.textContent='Copied '+h;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1200);};
  sws.forEach(s=>s.addEventListener('click',()=>copy(DATA.colors[+s.dataset.i].brand)));
  markers.forEach(m=>m.addEventListener('click',()=>copy(DATA.colors[+m.dataset.i].brand)));
</script>
</body></html>
